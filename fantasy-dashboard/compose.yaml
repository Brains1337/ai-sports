services:
  db:
    image: postgres:16
    container_name: fantasy-db
    environment:
      POSTGRES_DB: fantasy
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Chicago
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fantasy -d fantasy
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    image: python:3.12-slim
    container_name: fantasy-api
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      ESPN_S2: ${ESPN_S2:-}
      ESPN_SWID: ${ESPN_SWID:-}
      FANTASYPROS_API_KEY: ${FANTASYPROS_API_KEY:-}
    volumes:
      - ./app/api:/app
      - ./scripts:/scripts
      - ./data:/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  dashboard:
    image: node:20-bookworm-slim
    container_name: fantasy-dashboard
    working_dir: /app
    command: |
      bash -lc "npm ci && node server.js"
    environment:
      TZ: America/Chicago
      PORT: 3000
      DRAFT_BRIDGE_TOKEN: ${DRAFT_BRIDGE_TOKEN}
      DATABASE_URL: postgresql://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      ESPN_S2: ${ESPN_S2:-}
      ESPN_SWID: ${ESPN_SWID:-}
      ESPN_SEASON: ${ESPN_SEASON:-}
      ESPN_LEAGUE_IDS: ${ESPN_LEAGUE_IDS:-}
      ESPN_DRAFT_WS_URL: ${ESPN_DRAFT_WS_URL:-}
      ESPN_INGEST_URL: ${ESPN_INGEST_URL:-}
      YAHOO_INGEST_URL: ${YAHOO_INGEST_URL:-}
      YAHOO_LEAGUE_IDS: ${YAHOO_LEAGUE_IDS:-}
      FANTASYPROS_API_KEY: ${FANTASYPROS_API_KEY:-}
      RANKINGS_CSV: ${RANKINGS_CSV:-/data/board.csv}
      API_BASE_URL: ${API_BASE_URL:-http://fantasy-api:8000}      
    volumes:
      - ./app/dashboard:/app
      - ./data/runtime:/data
      - dashboard_nm:/app/node_modules
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  fantrax-poller:
    image: node:20-bookworm-slim
    container_name: fantasy-fantrax-poller
    working_dir: /app
    command: >
      bash -lc "npm ci && npm run poll:fantrax"
    environment:
      TZ: America/Chicago
      DRAFT_BRIDGE_TOKEN: ${DRAFT_BRIDGE_TOKEN}
      FANTRAX_LEAGUE_IDS: ${FANTRAX_LEAGUE_IDS:-}
      FANTRAX_COOKIE: ${FANTRAX_COOKIE:-}
      FANTRAX_POLL_MS: ${FANTRAX_POLL_MS:-3000}
      FANTRAX_INGEST_URL: ${FANTRAX_INGEST_URL:-http://dashboard:3000/provider/fantrax/draft-event}
    volumes:
      - ./app/dashboard:/app
      - ./scripts:/scripts
      - ./data/runtime:/data
      - fantrax_nm:/app/node_modules
    depends_on:
      dashboard:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: fantasy-adminer
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  yahoo-sync:
    image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    container_name: fantasy-yahoo-sync
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir sqlalchemy 'psycopg[binary]' playwright==1.47.0 &&
      python -m playwright install chromium &&
      while true; do
        python sync_yahoo.py;
        echo 'Sleeping until next sync...';
        sleep ${YAHOO_SYNC_INTERVAL_SECONDS:-21600};
      done"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      YAHOO_LEAGUE_IDS: ${YAHOO_LEAGUE_IDS:-37494}
      YAHOO_SEASON: ${YAHOO_SEASON:-2026}
      YAHOO_STATE_B64: ${YAHOO_STATE_B64}
      MY_TEAM_NAME: ${MY_TEAM_NAME}
    volumes:
      - ./scripts:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  espn-roster-sync:
    image: python:3.12-slim
    container_name: fantasy-espn-roster-sync
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir sqlalchemy 'psycopg[binary]' requests &&
      while true; do
        python sync_espn_rosters.py;
        echo 'Sleeping until next sync...';
        sleep ${ESPN_ROSTER_SYNC_INTERVAL_SECONDS:-7200};
      done"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      ESPN_S2: ${ESPN_S2:-}
      ESPN_SWID: ${ESPN_SWID:-}
      ESPN_SEASON: ${ESPN_SEASON:-2026}
      ESPN_LEAGUE_IDS: ${ESPN_LEAGUE_IDS:-719429857,209442251}
    volumes:
      - ./scripts:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  fantrax-sync:
    image: python:3.12-slim
    container_name: fantasy-fantrax-sync
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir sqlalchemy 'psycopg[binary]' requests &&
      while true; do
        python sync_fantrax.py;
        echo 'Sleeping until next sync...';
        sleep ${FANTRAX_SYNC_INTERVAL_SECONDS:-21600};
      done"
    environment:
      TZ: America/Chicago                   
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      FANTRAX_LEAGUE_IDS: ${FANTRAX_LEAGUE_IDS:-}
      FANTRAX_SEASON: ${FANTRAX_SEASON:-2026}
      FANTRAX_PLATFORM: fantrax-cfb
      FANTRAX_API_BASE: ${FANTRAX_API_BASE:-https://www.fantrax.com/fxea/general}
      FANTRAX_API_TOKEN: ${FANTRAX_API_TOKEN:-}
      FANTRAX_USER_SECRET_ID: ${FANTRAX_USER_SECRET_ID:-}
      FANTRAX_COOKIE: ${FANTRAX_COOKIE:-}
    volumes:
      - ./scripts:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  waiver-planner:
    image: python:3.12-slim
    container_name: fantasy-waiver-planner
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir sqlalchemy 'psycopg[binary]' &&
      while true; do
        python waiver_planner.py;
        echo 'Sleeping until next run...';
        sleep ${WAIVER_PLANNER_INTERVAL_SECONDS:-3600};
      done"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
    volumes:
      - ./scripts:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # NOTE: this service did not exist before 2026-09-08, which is why
  # FantasyPros projections were 9 days stale — the script was only ever run
  # by hand. Everything downstream for the two NFL leagues depends on it.
  fantasypros-sync:
    image: python:3.12-slim
    container_name: fantasy-fantasypros-sync
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      while true; do
        python sync_fantasypros.py || echo 'fantasypros sync FAILED';
        echo 'Sleeping until next FantasyPros sync...';
        sleep ${FANTASYPROS_SYNC_INTERVAL_SECONDS:-21600};
      done"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      FANTASYPROS_API_KEY: ${FANTASYPROS_API_KEY:-}
      FANTASY_SEASON: ${FANTASY_SEASON:-2026}
      FANTASY_WEEK: ${FANTASY_WEEK:-1}
      FP_BASE_URL: ${FP_BASE_URL:-https://api.fantasypros.com/v2/json}
      # 6h TTL stops a stale cache pinning old data indefinitely, which the
      # previous unbounded cache did.
      FP_CACHE_TTL: ${FP_CACHE_TTL:-21600}
      FP_CACHE_DIR: /data/cache/fantasypros
      FP_CALL_LIMIT: ${FP_CALL_LIMIT:-300}
      FP_REQUEST_DELAY_SECONDS: ${FP_REQUEST_DELAY_SECONDS:-1.5}
    volumes:
      - ./scripts:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  cfbd-projections:
    image: python:3.12-slim
    container_name: fantasy-cfbd-projections
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir sqlalchemy 'psycopg[binary]' requests &&
      while true; do
        python sync_cfbd_cfb_projections.py;
        echo 'Sleeping until next CFBD projections sync...';
        sleep ${CFBD_PROJECTIONS_INTERVAL_SECONDS:-21600};
      done"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      CFBD_API_KEY: ${CFBD_API_KEY:-}
      CFBD_SEASON: ${CFBD_SEASON:-2026}
      CFBD_WEEK: ${CFBD_WEEK:-1}
    volumes:
      - ./scripts:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  rankings-builder:
    image: python:3.12-slim
    container_name: fantasy-rankings-builder
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir sqlalchemy 'psycopg[binary]' requests &&
      while true; do
        python build_rankings.py;
        echo 'Sleeping until next rankings rebuild...';
        sleep ${RANKINGS_BUILD_INTERVAL_SECONDS:-86400};
      done"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql+psycopg://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
      ESPN_SEASON: ${ESPN_SEASON:-2026}
      RANKINGS_SPORT_DEFAULT: ${RANKINGS_SPORT_DEFAULT:-NFL}
      RANKINGS_SCORING_DEFAULT: ${RANKINGS_SCORING_DEFAULT:-PPR}
      FANTASY_WEEK: ${FANTASY_WEEK:-1}
      CFBD_SEASON: ${CFBD_SEASON:-2026}
      CFBD_WEEK: ${CFBD_WEEK:-1}
    volumes:
      - ./scripts:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  proxy_net:
    external: true

volumes:
  dashboard_nm:
  fantrax_nm: