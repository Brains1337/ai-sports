<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Roster Changes — Fantasy Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #4f8cff;
    --drop: #3a1f22;
    --drop-text: #ff6b6b;
    --add: #1f3a26;
    --add-text: #5fd97f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }
  .summary-cards {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 120px;
  }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }
  select, input, button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
  }
  button {
    cursor: pointer;
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 600;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr.drop { background: var(--drop); }
  tr.add { background: var(--add); }
  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  tr.drop .status-pill.current { background: var(--drop-text); color: #1a0a0b; }
  tr.add .status-pill.current { background: var(--add-text); color: #0a1a0d; }
  .pos-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .empty, .loading, .error {
    padding: 40px 0;
    text-align: center;
    color: var(--muted);
  }
  .error { color: var(--drop-text); }
  .pager {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    color: var(--muted);
    font-size: 13px;
  }
  .refresh-note {
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
  }
</style>
</head>
<body>
<header>
  <h1>Roster Changes</h1>
  <p>Season-long tracking of adds, drops, and status changes across leagues — replaces manual <code>roster_changes_report.sql</code> runs.</p>
</header>

<div class="container">
  <div class="summary-cards" id="summaryCards"></div>

  <div class="filters">
    <select id="posFilter">
      <option value="ALL">All positions</option>
      <option value="QB">QB</option>
      <option value="RB">RB</option>
      <option value="WR">WR</option>
      <option value="TE">TE</option>
      <option value="K">K</option>
      <option value="DEF">DEF</option>
    </select>

    <select id="statusFilter">
      <option value="all">All changes</option>
      <option value="drops">Drops (owned → FA/Waivers)</option>
      <option value="adds">Adds (FA/Waivers → owned)</option>
    </select>

    <select id="sinceFilter">
      <option value="24">Last 24 hours</option>
      <option value="72">Last 3 days</option>
      <option value="168">Last 7 days</option>
      <option value="0">All time</option>
    </select>

    <input type="text" id="teamFilter" placeholder="Filter by team name" />

    <button class="secondary" id="refreshBtn">Refresh</button>
    <span class="refresh-note" id="lastRefreshed"></span>
  </div>

  <div id="tableWrap">
    <table>
      <thead>
        <tr>
          <th data-sort="player_name">Player</th>
          <th data-sort="pos">Pos</th>
          <th>Previous</th>
          <th>Current</th>
          <th data-sort="latest_fetched_at">Changed At</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="loading">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pager" id="pager"></div>
</div>

<script>
const state = {
  page: 1,
  pageSize: 50,
  sortKey: 'latest_fetched_at',
  sortDir: 'desc',
};

function since_iso(hours) {
  if (!hours || hours === '0') return null;
  return new Date(Date.now() - Number(hours) * 3600 * 1000).toISOString();
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function statusLabel(s) {
  if (!s) return 'unknown';
  return s.replace('_', ' ');
}

function rowClass(row) {
  const isDrop = row.previous_status === 'owned' && ['free_agent', 'waivers'].includes(row.current_status);
  const isAdd = ['free_agent', 'waivers'].includes(row.previous_status) && row.current_status === 'owned';
  if (isDrop) return 'drop';
  if (isAdd) return 'add';
  return '';
}

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

function buildQuery() {
  const pos = document.getElementById('posFilter').value;
  const statusChange = document.getElementById('statusFilter').value;
  const sinceHours = document.getElementById('sinceFilter').value;
  const team = document.getElementById('teamFilter').value.trim();
  const since = since_iso(sinceHours);

  const params = new URLSearchParams({
    status_change: statusChange,
    pos,
    page: String(state.page),
    page_size: String(state.pageSize),
  });
  if (team) params.set('team', team);
  if (since) params.set('since', since);
  return params;
}

async function loadTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '<tr><td colspan="5" class="loading">Loading…</td></tr>';

  try {
    const params = buildQuery();
    const data = await fetchJSON(`/api/roster-changes?${params.toString()}`);
    renderTable(data);
    renderPager(data);
    document.getElementById('lastRefreshed').textContent =
      `Updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="error">Failed to load: ${e.message}</td></tr>`;
  }
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  const items = (data.items || []).slice().sort((a, b) => {
    const dir = state.sortDir === 'asc' ? 1 : -1;
    const va = a[state.sortKey], vb = b[state.sortKey];
    if (va === vb) return 0;
    return va > vb ? dir : -dir;
  });

  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No roster changes in the selected window.</td></tr>';
    return;
  }

  tbody.innerHTML = items.map(row => `
    <tr class="${rowClass(row)}">
      <td>${row.player_name}</td>
      <td><span class="pos-badge">${row.pos || ''}</span></td>
      <td>${statusLabel(row.previous_status)}${row.previous_team ? ' · ' + row.previous_team : ''}</td>
      <td><span class="status-pill current">${statusLabel(row.current_status)}</span>${row.current_team ? ' · ' + row.current_team : ''}</td>
      <td>${fmtDate(row.latest_fetched_at)}</td>
    </tr>
  `).join('');
}

function renderPager(data) {
  const totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
  const pager = document.getElementById('pager');
  pager.innerHTML = `
    <button class="secondary" id="prevPage" ${state.page <= 1 ? 'disabled' : ''}>Previous</button>
    <span>Page ${state.page} of ${totalPages} (${data.total} total)</span>
    <button class="secondary" id="nextPage" ${state.page >= totalPages ? 'disabled' : ''}>Next</button>
  `;
  document.getElementById('prevPage').onclick = () => { state.page = Math.max(1, state.page - 1); loadTable(); };
  document.getElementById('nextPage').onclick = () => { state.page = Math.min(totalPages, state.page + 1); loadTable(); };
}

async function loadSummary() {
  const container = document.getElementById('summaryCards');
  try {
    const sinceHours = document.getElementById('sinceFilter').value;
    const since = since_iso(sinceHours);
    const params = new URLSearchParams();
    if (since) params.set('since', since);

    const data = await fetchJSON(`/api/roster-changes/summary?${params.toString()}`);
    const drops = data.items.filter(i => ['free_agent', 'waivers'].includes(i.current_status))
      .reduce((sum, i) => sum + Number(i.count), 0);
    const adds = data.items.filter(i => i.current_status === 'owned')
      .reduce((sum, i) => sum + Number(i.count), 0);

    container.innerHTML = `
      <div class="card"><div class="label">Total changes</div><div class="value">${drops + adds}</div></div>
      <div class="card"><div class="label">Drops</div><div class="value" style="color:var(--drop-text)">${drops}</div></div>
      <div class="card"><div class="label">Adds</div><div class="value" style="color:var(--add-text)">${adds}</div></div>
    `;
  } catch (e) {
    container.innerHTML = `<div class="card error">Summary unavailable</div>`;
  }
}

function refreshAll() {
  state.page = 1;
  loadTable();
  loadSummary();
}

document.getElementById('refreshBtn').onclick = refreshAll;
document.getElementById('posFilter').onchange = refreshAll;
document.getElementById('statusFilter').onchange = refreshAll;
document.getElementById('sinceFilter').onchange = refreshAll;
document.getElementById('teamFilter').onkeydown = (e) => { if (e.key === 'Enter') refreshAll(); };

document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.getAttribute('data-sort');
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = 'desc';
    }
    loadTable();
  });
});

refreshAll();
setInterval(refreshAll, 5 * 60 * 1000); // auto-refresh every 5 min
</script>
</body>
</html>
