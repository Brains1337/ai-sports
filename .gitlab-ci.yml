# ============================================================
# AI Sports Platform — GitLab CI/CD Pipeline
# Runner:  shell executor on llm-sports-p01
# Tag:     ai-sports_production
# ============================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER:            overlay2
  IMAGE_API:                $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
  IMAGE_DASHBOARD:          $CI_REGISTRY_IMAGE/dashboard:$CI_COMMIT_SHORT_SHA
  IMAGE_API_LATEST:         $CI_REGISTRY_IMAGE/api:latest
  IMAGE_DASHBOARD_LATEST:   $CI_REGISTRY_IMAGE/dashboard:latest
  STACK_FANTASY:            /opt/stacks/fantasy-dashboard
  STACK_DOCKGE:             /opt/stacks/dockge
  STACK_NPM:                /opt/stacks/npm
  CI_VENV:                  /opt/stacks/.venvs/ci
  CI_PYTHON: python3.12  

# All jobs run on the shell runner on llm-sports-p01
default:
  tags:
    - ai-sports_production

# ─────────────────────────────────────────────
# LINT STAGE
# ─────────────────────────────────────────────

lint:python:
  stage: lint
  script:
    - echo "→ Setting up CI venv..."
    - python3 -m venv $CI_VENV
    - $CI_VENV/bin/pip install --quiet --upgrade flake8 black isort
    - echo "→ black --check..."
    - $CI_VENV/bin/black --check $CI_PROJECT_DIR/fantasy-dashboard/app/api/
    - echo "→ isort --check-only..."
    - $CI_VENV/bin/isort --check-only $CI_PROJECT_DIR/fantasy-dashboard/app/api/
    - echo "→ flake8..."
    - $CI_VENV/bin/flake8 $CI_PROJECT_DIR/fantasy-dashboard/app/api/ --max-line-length=100
  rules:
    - changes:
        - "fantasy-dashboard/app/api/**/*.py"

lint:node:
  stage: lint
  script:
    - echo "→ Installing Node linters..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard
    - npm ci --silent
    - npx eslint . --ext .js,.jsx,.ts,.tsx || true
  rules:
    - changes:
        - "fantasy-dashboard/app/dashboard/**/*.{js,jsx,ts,tsx}"

# ─────────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────────

test:python:
  stage: test
  script:
    - echo "→ Setting up CI venv..."
    - $CI_PYTHON -m venv $CI_VENV
    - $CI_VENV/bin/pip install --quiet -r $CI_PROJECT_DIR/fantasy-dashboard/app/api/requirements.txt
    - echo "→ Running pytest..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/api
    - $CI_VENV/bin/pytest tests/ -v --tb=short || true
  rules:
    - changes:
        - "fantasy-dashboard/app/api/**/*"

test:node:
  stage: test
  script:
    - echo "→ Installing Node deps..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard
    - npm ci --silent
    - npm test --if-present || true
  rules:
    - changes:
        - "fantasy-dashboard/app/dashboard/**/*"

# ─────────────────────────────────────────────
# BUILD STAGE
# Shell runner uses host Docker — no DinD needed.
# Multi-stage Dockerfiles are in:
#   fantasy-dashboard/app/api/Dockerfile
#   fantasy-dashboard/app/dashboard/Dockerfile
# ─────────────────────────────────────────────

build:api:
  stage: build
  script:
    - echo "→ Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "→ Building API image..."
    - |
      docker build \
        --cache-from $IMAGE_API_LATEST \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t $IMAGE_API \
        -t $IMAGE_API_LATEST \
        -f $CI_PROJECT_DIR/fantasy-dashboard/app/api/Dockerfile \
        $CI_PROJECT_DIR/fantasy-dashboard/app/api/
    - docker push $IMAGE_API
    - docker push $IMAGE_API_LATEST
    - echo "✅ API image pushed → $IMAGE_API"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "fantasy-dashboard/app/api/**"
    - if: $CI_COMMIT_TAG

build:dashboard:
  stage: build
  script:
    - echo "→ Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "→ Building Dashboard image..."
    - |
      docker build \
        --cache-from $IMAGE_DASHBOARD_LATEST \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t $IMAGE_DASHBOARD \
        -t $IMAGE_DASHBOARD_LATEST \
        -f $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard/Dockerfile \
        $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard/
    - docker push $IMAGE_DASHBOARD
    - docker push $IMAGE_DASHBOARD_LATEST
    - echo "✅ Dashboard image pushed → $IMAGE_DASHBOARD"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "fantasy-dashboard/app/dashboard/**"
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────
# DEPLOY STAGE
# Runs directly on llm-sports-p01 via shell runner.
# Syncs compose.yaml from repo → stack dir, then
# pulls latest images and restarts the stack.
#
# One-time host setup (runner group membership):
#   sudo usermod -aG fantasy gitlab-runner
#   sudo usermod -aG docker  gitlab-runner
#   sudo systemctl restart gitlab-runner
# ─────────────────────────────────────────────

deploy:fantasy-dashboard:
  stage: deploy
  script:
    - echo "→ Syncing compose file..."
    - cp -f $CI_PROJECT_DIR/fantasy-dashboard/compose.yaml $STACK_FANTASY/compose.yaml
    - echo "→ Logging into registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "→ Pulling & restarting fantasy-dashboard stack..."
    - cd $STACK_FANTASY && docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ fantasy-dashboard live"
  environment:
    name: production/fantasy-dashboard
    url: https://draft.ai.goffs.xyz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:dockge:
  stage: deploy
  script:
    - echo "→ Syncing compose file..."
    - cp -f $CI_PROJECT_DIR/dockge/compose.yaml $STACK_DOCKGE/compose.yaml
    - echo "→ Pulling & restarting dockge..."
    - cd $STACK_DOCKGE && docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ dockge live"
  environment:
    name: production/dockge
    url: https://dockge.ai.goffs.xyz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:npm:
  stage: deploy
  script:
    - echo "→ Syncing compose file..."
    - cp -f $CI_PROJECT_DIR/npm/compose.yaml $STACK_NPM/compose.yaml
    - echo "→ Pulling & restarting Nginx Proxy Manager..."
    - cd $STACK_NPM && docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ Nginx Proxy Manager live"
  environment:
    name: production/npm
    url: https://npm.ai.goffs.xyz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
