# ============================================================
# AI Sports Platform — GitLab CI/CD Pipeline
# Runner:  shell executor on llm-sports-p01
# Tag:     ai-sports_production
# Model:   bind-mounted deploys from local runner checkout
# ============================================================

stages:
  - lint
  - test
  - deploy

variables:
  STACK_FANTASY: /opt/stacks/fantasy-dashboard
  STACK_DOCKGE: /opt/stacks/dockge
  STACK_NPM: /opt/stacks/npm
  CI_VENV: /opt/stacks/.venvs/ci
  CI_PYTHON: python3.12

default:
  tags:
    - ai-sports_production

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: always

# ─────────────────────────────────────────────
# LINT
# ─────────────────────────────────────────────

lint:python:
  stage: lint
  script:
    - echo "→ Setting up CI venv..."
    - $CI_PYTHON -m venv $CI_VENV
    - $CI_VENV/bin/pip install --quiet --upgrade pip flake8 black isort
    - echo "→ black --check..."
    - $CI_VENV/bin/black --check $CI_PROJECT_DIR/fantasy-dashboard/app/api/
    - echo "→ isort --check-only..."
    - $CI_VENV/bin/isort --check-only $CI_PROJECT_DIR/fantasy-dashboard/app/api/
    - echo "→ flake8..."
    - $CI_VENV/bin/flake8 $CI_PROJECT_DIR/fantasy-dashboard/app/api/ --max-line-length=100
  rules:
    - changes:
        - pyproject.toml
        - fantasy-dashboard/app/api/**/*.py

lint:node:
  stage: lint
  script:
    - echo "→ Installing Node linters..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard
    - npm ci --silent
    - npx eslint . --ext .js,.jsx,.ts,.tsx || true
  rules:
    - changes:
        - fantasy-dashboard/app/dashboard/**/*.{js,jsx,ts,tsx}
        - fantasy-dashboard/app/dashboard/**/*.js
        - fantasy-dashboard/app/dashboard/**/*.jsx
        - fantasy-dashboard/app/dashboard/**/*.ts
        - fantasy-dashboard/app/dashboard/**/*.tsx
 
lint:ci:
  stage: lint
  script:
    - echo "CI config changed"
    - echo "source=$CI_PIPELINE_SOURCE branch=$CI_COMMIT_BRANCH"
  rules:
    - changes:
        - .gitlab-ci.yml
    - when: never

# ─────────────────────────────────────────────
# TEST
# ─────────────────────────────────────────────

test:python:
  stage: test
  script:
    - echo "→ Setting up CI venv..."
    - $CI_PYTHON -m venv $CI_VENV
    - $CI_VENV/bin/pip install --quiet -r $CI_PROJECT_DIR/fantasy-dashboard/app/api/requirements.txt
    - echo "→ Running pytest..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/api
    - $CI_VENV/bin/pytest tests/ -v --tb=short || true
  rules:
    - changes:
        - pyproject.toml
        - fantasy-dashboard/app/api/**/*

test:node:
  stage: test
  script:
    - echo "→ Installing Node deps..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard
    - npm ci --silent
    - npm test --if-present || true
  rules:
    - changes:
        - fantasy-dashboard/app/dashboard/**/*

# ─────────────────────────────────────────────
# DEPLOY — FANTASY STACK
# This stack is bind-mounted, so deploy = sync files locally
# from $CI_PROJECT_DIR into /opt/stacks/fantasy-dashboard
# and restart affected services.
# ─────────────────────────────────────────────

deploy:fantasy-dashboard:
  stage: deploy
  script:
    - echo "→ Syncing fantasy-dashboard files to stack dir..."
    - rsync -rlptD --no-owner --no-group --delete \
      --exclude='.env' --exclude='.env.bak' --exclude='.venv/' \
      --exclude='node_modules/' --exclude='backups/' \
      --exclude='data/postgres/' --exclude='data/runtime/' \
      --exclude='data/cache/' --exclude='data/imports/' \
      --exclude='data/logs/' --exclude='__pycache__/' \
      --exclude='*.pyc' \
      "$CI_PROJECT_DIR/fantasy-dashboard/" "$STACK_FANTASY/"
    - echo "→ Restarting fantasy services..."
    - cd "$STACK_FANTASY" && docker compose up -d --no-deps api dashboard fantrax-poller
    - echo "→ Verifying dashboard health..."
    - >
      docker exec fantasy-dashboard node -e "
      const http = require('http');
      http.get('http://localhost:3000/api/rooms', r => {
        let d=''; r.on('data', c => d += c);
        r.on('end', () => {
          try { JSON.parse(d); console.log('Health check OK'); process.exit(0); }
          catch (e) { console.error('Health check failed:', d.slice(0,200)); process.exit(1); }
        });
      }).on('error', e => { console.error(e.message); process.exit(1); });
      "
    - docker image prune -f
    - echo "✅ fantasy-dashboard live"
  environment:
    name: production/fantasy-dashboard
    url: https://draft.ai.goffs.xyz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ─────────────────────────────────────────────
# DEPLOY — DOCKGE
# Sync local stack files and recreate as needed.
# ─────────────────────────────────────────────

deploy:dockge:
  stage: deploy
  script:
    - echo "→ Syncing dockge files..."
    - >
      rsync -a --delete
      --exclude='.env'
      --exclude='data/'
      $CI_PROJECT_DIR/dockge/
      $STACK_DOCKGE/
    - echo "→ Restarting dockge..."
    - cd $STACK_DOCKGE && docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ dockge live"
  environment:
    name: production/dockge
    url: https://dockge.ai.goffs.xyz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - dockge/**
      when: manual

# ─────────────────────────────────────────────
# DEPLOY — NGINX PROXY MANAGER
# Sync local stack files and recreate as needed.
# ─────────────────────────────────────────────

deploy:npm:
  stage: deploy
  script:
    - echo "→ Syncing npm files..."
    - >
      rsync -a --delete
      --exclude='.env'
      --exclude='data/'
      $CI_PROJECT_DIR/npm/
      $STACK_NPM/
    - echo "→ Restarting Nginx Proxy Manager..."
    - cd $STACK_NPM && docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ Nginx Proxy Manager live"
  environment:
    name: production/npm
    url: https://npm.ai.goffs.xyz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - npm/**
      when: manual