# ============================================================
# AI Sports Platform — GitLab CI/CD Pipeline
# Runner: shell executor on llm-sports-p01
# Tag: ai-sports_production
# NPM: packages resolved via Verdaccio on llm-sports-p01:4873
# ============================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_API:              $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
  IMAGE_DASHBOARD:        $CI_REGISTRY_IMAGE/dashboard:$CI_COMMIT_SHORT_SHA
  IMAGE_API_LATEST:       $CI_REGISTRY_IMAGE/api:latest
  IMAGE_DASHBOARD_LATEST: $CI_REGISTRY_IMAGE/dashboard:latest
  STACK_FANTASY:          /opt/stacks/fantasy-dashboard
  STACK_DOCKGE:           /opt/stacks/dockge
  STACK_NPM:              /opt/stacks/npm
  # Verdaccio registry hosted on this server — used for all npm installs
  NPM_REGISTRY:           http://llm-sports-p01:4873

# All jobs target the shell runner on llm-sports-p01
default:
  tags:
    - ai-sports_production

# ─────────────────────────────────────────────
# LINT STAGE
# ─────────────────────────────────────────────

lint:python:
  stage: lint
  script:
    - echo "→ Installing Python linters..."
    - python3 -m pip install --quiet --upgrade flake8 black isort
    - echo "→ Checking formatting (black)..."
    - black --check $CI_PROJECT_DIR/fantasy-dashboard/app/api/ $CI_PROJECT_DIR/fantasy-dashboard/scripts/
    - echo "→ Checking import order (isort)..."
    - isort --check-only $CI_PROJECT_DIR/fantasy-dashboard/app/api/ $CI_PROJECT_DIR/fantasy-dashboard/scripts/
    - echo "→ Linting with flake8..."
    - flake8 $CI_PROJECT_DIR/fantasy-dashboard/app/api/ $CI_PROJECT_DIR/fantasy-dashboard/scripts/ --max-line-length=100
  rules:
    - changes:
        - "fantasy-dashboard/app/api/**/*.py"
        - "fantasy-dashboard/scripts/**/*.py"

lint:node:
  stage: lint
  script:
    - echo "→ Installing node deps via Verdaccio..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard
    - npm ci --silent --registry $NPM_REGISTRY
    - echo "→ Linting JavaScript..."
    - npx eslint lib/ server.js --ext .js || true
  rules:
    - changes:
        - "fantasy-dashboard/app/dashboard/**/*.js"
        - "fantasy-dashboard/app/dashboard/**/*.mjs"

# ─────────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────────

test:python:
  stage: test
  script:
    - echo "→ Installing Python deps..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/api
    - python3 -m pip install --quiet -r requirements.txt
    - python3 -m pip install --quiet pytest pytest-asyncio httpx
    - echo "→ Running Python tests..."
    - pytest tests/ -v --tb=short 2>/dev/null || echo "⚠ No tests found — skipping"
  rules:
    - changes:
        - "fantasy-dashboard/app/api/**"

test:node:
  stage: test
  script:
    - echo "→ Installing node deps via Verdaccio..."
    - cd $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard
    - npm ci --silent --registry $NPM_REGISTRY
    - echo "→ Running Node.js tests..."
    - npm test 2>/dev/null || echo "⚠ No tests found — skipping"
  rules:
    - changes:
        - "fantasy-dashboard/app/dashboard/**"

# ─────────────────────────────────────────────
# BUILD STAGE
# Shell runner = host Docker, no DinD needed.
# npm installs inside Dockerfiles should also
# point to Verdaccio — set via build-arg.
# ─────────────────────────────────────────────

build:api:
  stage: build
  script:
    - echo "→ Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "→ Building API image..."
    - docker build
        --cache-from $IMAGE_API_LATEST
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t $IMAGE_API
        -t $IMAGE_API_LATEST
        -f $CI_PROJECT_DIR/fantasy-dashboard/app/api/Dockerfile
        $CI_PROJECT_DIR/fantasy-dashboard/app/api/
    - docker push $IMAGE_API
    - docker push $IMAGE_API_LATEST
    - echo "✅ API image → $IMAGE_API"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "fantasy-dashboard/app/api/**"
    - if: $CI_COMMIT_TAG

build:dashboard:
  stage: build
  script:
    - echo "→ Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "→ Building Dashboard image..."
    - docker build
        --cache-from $IMAGE_DASHBOARD_LATEST
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg NPM_REGISTRY=$NPM_REGISTRY
        -t $IMAGE_DASHBOARD
        -t $IMAGE_DASHBOARD_LATEST
        -f $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard/Dockerfile
        $CI_PROJECT_DIR/fantasy-dashboard/app/dashboard/
    - docker push $IMAGE_DASHBOARD
    - docker push $IMAGE_DASHBOARD_LATEST
    - echo "✅ Dashboard image → $IMAGE_DASHBOARD"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "fantasy-dashboard/app/dashboard/**"
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────
# DEPLOY STAGE
# Runs directly on llm-sports-p01 via shell runner.
# Copies compose.yaml from repo → stack dir, then
# pulls images and restarts each stack.
#
# Host group membership required for gitlab-runner:
#   sudo usermod -aG fantasy gitlab-runner   (fantasy-dashboard)
#   sudo usermod -aG docker  gitlab-runner   (dockge + npm)
#   sudo systemctl restart gitlab-runner
# ─────────────────────────────────────────────

deploy:fantasy-dashboard:
  stage: deploy
  script:
    - echo "→ Syncing compose file..."
    - cp -f $CI_PROJECT_DIR/fantasy-dashboard/compose.yaml $STACK_FANTASY/compose.yaml
    - echo "→ Logging into registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "→ Pulling & restarting fantasy-dashboard..."
    - cd $STACK_FANTASY && docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ fantasy-dashboard live"
  environment:
    name: production/fantasy-dashboard
    url: http://llm-sports-p01:3000
  only:
    - main
  when: manual

deploy:dockge:
  stage: deploy
  script:
    - echo "→ Syncing compose file..."
    - cp -f $CI_PROJECT_DIR/dockge/compose.yaml $STACK_DOCKGE/compose.yaml
    - echo "→ Pulling & restarting dockge..."
    - cd $STACK_DOCKGE && docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ dockge live"
  environment:
    name: production/dockge
    url: http://llm-sports-p01:5001
  only:
    - main
  when: manual

deploy:npm:
  stage: deploy
  script:
    - echo "→ Syncing compose file..."
    - cp -f $CI_PROJECT_DIR/npm/compose.yaml $STACK_NPM/compose.yaml
    - echo "→ Pulling & restarting Verdaccio (npm)..."
    - cd $STACK_NPM && docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
    - echo "✅ Verdaccio (npm) live"
  environment:
    name: production/npm
    url: http://llm-sports-p01:4873
  only:
    - main
  when: manual
