services:
  npm:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: npm
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/configs/nginx-proxy-manager/data:/data
      - /opt/configs/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
